<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Smart Tourist Guide</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);">

  <header class="site-header">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <div class="brand-icon">🧭</div>
        <span>Smart Tourist Guide</span>
      </a>
      <div class="nav-actions">
        <a href="/login" class="btn btn-sm btn-secondary">Already registered? Log In</a>
      </div>
    </div>
  </header>

  <main class="main-content" style="display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
    <div style="background: white; border: 1px solid var(--border-light); border-radius: var(--radius-xl); padding: 2.5rem; max-width: 480px; width: 100%; box-shadow: var(--shadow-xl);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 52px; height: 52px; border-radius: var(--radius-lg); background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 1rem;">
          ✨
        </div>
        <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--secondary);">Create Your Account</h1>
        <p style="color: var(--text-muted); font-size: 0.9375rem; margin-top: 0.375rem;">Unlock AI trip planning, cloud itineraries, and personalized travel recommendations.</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Gokul Murugan" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="traveler@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-language">Preferred Language</label>
          <select id="reg-language" class="form-control">
            <option value="English" selected>English</option>
            <option value="Tamil">Tamil (தமிழ்)</option>
            <option value="Hindi">Hindi (हिन्दी)</option>
            <option value="Malayalam">Malayalam (മലയാളം)</option>
            <option value="Telugu">Telugu (తెలుగు)</option>
            <option value="French">French (Français)</option>
            <option value="Spanish">Spanish (Español)</option>
          </select>
        </div>

        <button type="submit" id="reg-btn" class="btn btn-primary" style="width: 100%; padding: 0.875rem; margin-top: 0.75rem;">
          Create Free Account
        </button>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
          <span>Already have an account? </span>
          <a href="/login" style="color: var(--primary); font-weight: 600;">Log In</a>
        </div>
      </form>
    </div>
  </main>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('register-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('reg-btn');
        btn.disabled = true;
        btn.textContent = 'Creating account...';

        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        const language = document.getElementById('reg-language').value;

        const res = await Auth.register(name, email, password, language);
        if (res.success) {
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 600);
        } else {
          btn.disabled = false;
          btn.textContent = 'Create Free Account';
        }
      });
    });
  </script>
</body>
</html>
