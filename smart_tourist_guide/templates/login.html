<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Smart Tourist Guide</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);">

  <header class="site-header">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <div class="brand-icon">🧭</div>
        <span>Smart Tourist Guide</span>
      </a>
      <div class="nav-actions">
        <a href="/register" class="btn btn-sm btn-secondary">Don't have an account? Sign Up</a>
      </div>
    </div>
  </header>

  <main class="main-content" style="display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
    <div style="background: white; border: 1px solid var(--border-light); border-radius: var(--radius-xl); padding: 2.5rem; max-width: 440px; width: 100%; box-shadow: var(--shadow-xl);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 52px; height: 52px; border-radius: var(--radius-lg); background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 1rem;">
          🔑
        </div>
        <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--secondary);">Welcome Back</h1>
        <p style="color: var(--text-muted); font-size: 0.9375rem; margin-top: 0.375rem;">Log in to access your saved trips, favorites, and custom recommendations.</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="traveler@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%; padding: 0.875rem; margin-top: 0.5rem;">
          Log In
        </button>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
          <span>New to Smart Tourist Guide? </span>
          <a href="/register" style="color: var(--primary); font-weight: 600;">Create an Account</a>
        </div>

        <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); font-size: 0.8125rem; color: #64748b; text-align: center;">
          <b>Demo Accounts:</b><br>
          Admin: <code>admin@smarttourist.com</code> (Pass: <code>admin123</code>)<br>
          User: <code>user@example.com</code> (Pass: <code>traveler123</code>)
        </div>
      </form>
    </div>
  </main>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect
      if (Auth.getCurrentUser()) {
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || '/dashboard';
        window.location.href = redirect;
        return;
      }

      const form = document.getElementById('login-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('login-btn');
        btn.disabled = true;
        btn.textContent = 'Logging in...';

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        const res = await Auth.login(email, password);
        if (res.success) {
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get('redirect') || '/dashboard';
          setTimeout(() => {
            window.location.href = redirect;
          }, 600);
        } else {
          btn.disabled = false;
          btn.textContent = 'Log In';
        }
      });
    });
  </script>
</body>
</html>
